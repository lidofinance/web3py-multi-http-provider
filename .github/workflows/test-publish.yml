name: Test PyPI Publishing

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-publish:
    runs-on: ubuntu-latest
    # Must match the environment of the trusted publisher on TestPyPI.
    environment: testpypi
    permissions:
      contents: read
      # TestPyPI trusted publishing and the Sigstore signing of the attestations.
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Python and Poetry
        uses: ./.github/actions/setup
        with:
          python-version: '3.12'

      - name: Set a unique dev version
        # PyPI rejects local versions (with +) and reuploads, so every publish gets its own .devN:
        # 2.3.0 -> 2.3.1.dev<epoch seconds modulo 10 million>.
        run: |
          IFS='.' read -r MAJOR MINOR PATCH <<< "$(poetry version -s)"
          poetry version "${MAJOR}.${MINOR}.$((PATCH + 1)).dev$(( $(date +%s) % 10000000 ))"
          echo "Building version $(poetry version -s)"

      - name: Build
        run: poetry build --no-interaction

      - name: Install the publish tools
        run: |
          python -m venv "$RUNNER_TEMP/publish"
          "$RUNNER_TEMP/publish/bin/pip" install --quiet "pypi-attestations==0.0.30" "twine==7.0.0"

      - name: Sign the distributions
        timeout-minutes: 5
        run: |
          "$RUNNER_TEMP/publish/bin/python" -m pypi_attestations sign dist/*.whl dist/*.tar.gz
          ls -l dist/

      - name: Publish to TestPyPI
        run: |
          TWINE_PASSWORD=$(.github/scripts/pypi_oidc_token.sh test.pypi.org)
          export TWINE_PASSWORD TWINE_USERNAME=__token__
          "$RUNNER_TEMP/publish/bin/twine" upload --non-interactive --attestations \
            --repository-url https://test.pypi.org/legacy/ dist/*
